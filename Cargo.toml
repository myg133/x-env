[package]
name = "x-env"
version = "0.1.0"
edition = "2021"
description = "Run programs with environment variables from config files"
license = "MIT"
repository = "https://github.com/your-repo/x-env"
keywords = ["environment", "env", "config", "runner"]
categories = ["utility", "command-line-utilities"]

[[bin]]
name = "x-env"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
